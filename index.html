<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cascos">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Cascos · Chácara de Nielt</title>
<style>
:root{
  --bg:#f4f6f4; --card:#fff; --card2:#fbfcfb; --ink:#16211c; --mut:#5f6f66; --line:#dde4df;
  --pri:#15624a; --pri-l:#e6f0eb; --ok:#2c7a58; --ok-l:#e2f2ea;
  --dan:#a63a2b; --dan-l:#fae9e6; --warn:#8a6d15; --warn-l:#faf3dc;
  --azul:#2f5d8a; --azul-l:#e7eff7; --neu:#5f6f66; --neu-l:#eceff0;
  --sel:#fff; --sombra:0 1px 2px rgba(15,40,30,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#101613; --card:#18211d; --card2:#1d2823; --ink:#e8efea; --mut:#93a49a; --line:#26332c;
  --pri:#57b48f; --pri-l:#173229; --ok:#5cbc92; --ok-l:#122c22;
  --dan:#e08171; --dan-l:#331915; --warn:#d7b455; --warn-l:#2e2712;
  --azul:#7fa8d4; --azul-l:#15202c; --neu:#93a49a; --neu-l:#212b26;
  --sel:#101613; --sombra:none;
} }
:root[data-theme="dark"]{
  --bg:#101613; --card:#18211d; --card2:#1d2823; --ink:#e8efea; --mut:#93a49a; --line:#26332c;
  --pri:#57b48f; --pri-l:#173229; --ok:#5cbc92; --ok-l:#122c22;
  --dan:#e08171; --dan-l:#331915; --warn:#d7b455; --warn-l:#2e2712;
  --azul:#7fa8d4; --azul-l:#15202c; --neu:#93a49a; --neu-l:#212b26;
  --sel:#101613; --sombra:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.tit{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.tit h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.01em}
.tit span{font-size:11.5px;color:var(--mut)}
.busca{position:relative;display:flex}
.busca input{flex:1;width:100%;height:50px;padding:0 42px 0 14px;font-size:19px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card2);color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.busca input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.busca input::placeholder{font-family:-apple-system,system-ui,sans-serif;font-size:16px;color:var(--mut)}
.limpar{position:absolute;right:5px;top:5px;width:40px;height:40px;border:0;background:none;
  color:var(--mut);font-size:20px;cursor:pointer;border-radius:10px}

.chips{display:flex;gap:7px;overflow-x:auto;margin-top:9px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:17px;
  background:var(--card2);color:var(--mut);font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;
  font-family:inherit}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--sel)}
.chip:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat}

.conta{margin:12px 16px 8px;font-size:12.5px;color:var(--mut)}
.vazio{text-align:center;color:var(--mut);font-size:14px;padding:40px 24px;line-height:1.6}

/* ---- painel de entrada ---- */
.painel{margin:14px 16px 4px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--sombra)}
.pcard b{display:block;font-size:25px;font-weight:660;letter-spacing:-.02em;line-height:1.1;
  font-variant-numeric:tabular-nums}
.pcard span{display:block;font-size:12px;color:var(--mut);margin-top:3px;line-height:1.35}
.pcard.g b{color:var(--dan)} .pcard.y b{color:var(--warn)} .pcard.b b{color:var(--azul)}

/* ---- lista ---- */
ul#lista{list-style:none;margin:0;padding:0 16px 8px}
ul#lista li{margin-bottom:7px}
.it{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;
  box-shadow:var(--sombra)}
.it:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.it .br{font-size:21px;font-weight:650;letter-spacing:-.02em;min-width:62px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.it .meio{flex:1;min-width:0}
.it .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.it .l2{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .dias{text-align:right;font-size:19px;font-weight:620;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.1}
.it .dias small{display:block;font-size:10.5px;font-weight:500;color:var(--mut);letter-spacing:.02em}
.mais{display:block;width:calc(100% - 32px);margin:2px auto 0;height:46px;border:1px dashed var(--line);
  background:var(--card);color:var(--pri);font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;font-family:inherit}

/* ---- etiquetas ---- */
.tg{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;
  letter-spacing:.02em;white-space:nowrap;text-transform:uppercase}
.t-ok{background:var(--ok-l);color:var(--ok)} .t-dan{background:var(--dan-l);color:var(--dan)}
.t-warn{background:var(--warn-l);color:var(--warn)} .t-neu{background:var(--neu-l);color:var(--neu)}
.t-azul{background:var(--azul-l);color:var(--azul)} .t-pri{background:var(--pri-l);color:var(--pri)}

/* ---- ficha ---- */
.voltar{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 8px;border:1px solid var(--line);
  border-radius:19px;background:var(--card2);color:var(--pri);font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer}
.fbr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 16px 2px}
.fbr h2{margin:0;font-size:40px;font-weight:680;letter-spacing:-.03em;line-height:1;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.fbr .nm{font-size:15px;color:var(--mut)}
.fsub{margin:7px 16px 0;font-size:13px;color:var(--mut);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bloco{background:var(--card);border:1px solid var(--line);border-radius:13px;margin:12px 16px;
  padding:13px 14px;box-shadow:var(--sombra)}
.bloco h3{margin:0 0 9px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.kv .k{font-size:11.5px;color:var(--mut);letter-spacing:.01em}
.kv .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.kv .v small{font-size:12px;font-weight:500;color:var(--mut)}
.nota{font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}

.av{border-radius:13px;margin:10px 16px;padding:12px 14px;border:1px solid;font-size:13.5px;line-height:1.5}
.av b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.av .obs{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.a-dan{background:var(--dan-l);border-color:var(--dan);color:var(--dan)}
.a-warn{background:var(--warn-l);border-color:var(--warn);color:var(--warn)}
.a-azul{background:var(--azul-l);border-color:var(--azul);color:var(--azul)}
.a-neu{background:var(--neu-l);border-color:var(--line);color:var(--mut)}

/* ---- linha do tempo ---- */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 15px 21px;border-left:2px solid var(--line)}
.tl li:last-child{padding-bottom:0;border-left-color:transparent}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--neu);border:2px solid var(--card)}
.tl li.ach::before{background:var(--dan)} .tl li.sec::before{background:var(--azul)}
.tl li.par::before{background:var(--card);border:2px solid var(--mut)}
.tl .qd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tl .dt{font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tl .int{font-size:11.5px;color:var(--mut)}
.tl .txt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;
  margin-top:4px;word-break:break-word}
.tl .tr{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.tl .fo{font-size:11px;color:var(--mut);margin-top:5px}
footer{padding:16px 16px 34px;font-size:11.5px;color:var(--mut);line-height:1.6}
footer b{color:var(--ink);font-weight:600}

/* ---- trava ---- */
.trava{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.trava form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:26px 22px;box-shadow:var(--sombra)}
.trava h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.02em}
.trava p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.5}
.trava input[type=password]{height:50px;padding:0 14px;font-size:17px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card2);color:var(--ink);font-family:inherit}
.trava input[type=password]:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.trava label{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--ink)}
.trava input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
.trava button{height:50px;border:0;border-radius:12px;background:var(--pri);color:var(--sel);font-size:16px;
  font-weight:650;font-family:inherit;cursor:pointer}
.trava button[disabled]{opacity:.6}
.trava .erro{color:var(--dan);font-weight:600;min-height:1.2em}
.esquecer{display:block;margin:0 auto 34px;border:0;background:none;color:var(--mut);font-size:12.5px;
  text-decoration:underline;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="trava" id="trava" hidden>
  <form id="fTrava" autocomplete="on">
    <h1>Cascos</h1>
    <p>Chácara de Nielt · histórico de casqueamento por brinco. Digite a senha que o Emilio passou (a mesma da Lista do Curral).</p>
    <input id="senha" type="password" inputmode="text" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
    <label><input id="lembrar" type="checkbox" checked> Lembrar neste celular</label>
    <button id="entrar" type="submit">Entrar</button>
    <p class="erro" id="erro" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
<div class="wrap">
  <div id="tela">
    <header>
      <div class="tit"><h1>Cascos · Chácara de Nielt</h1><span id="dia"></span></div>
      <div class="busca">
        <input id="q" type="search" inputmode="numeric" enterkeyhint="search" autocomplete="off"
               autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Digite o brinco">
        <button class="limpar" id="limpar" type="button" aria-label="Limpar busca" hidden>&#10005;</button>
      </div>
      <div class="chips" id="chips">
        <button class="chip" type="button" data-f="fila" aria-pressed="false">Na fila</button>
        <button class="chip" type="button" data-f="atr" aria-pressed="false">Atrasada</button>
        <button class="chip" type="button" data-f="vencer" aria-pressed="false">A vencer</button>
        <button class="chip" type="button" data-f="les" aria-pressed="false">Achado aberto</button>
        <button class="chip" type="button" data-f="tac" aria-pressed="false">Taco aberto</button>
        <select class="chip" id="fLote" aria-label="Lote"></select>
      </div>
    </header>
    <div class="painel" id="painel" hidden></div>
    <p class="conta" id="conta" hidden></p>
    <ul id="lista"></ul>
    <button class="mais" id="mais" type="button" hidden></button>
    <p class="vazio" id="vazio" hidden></p>
    <footer id="rodape"></footer>
  </div>
  <div id="ficha" hidden></div>
</div>
<button class="esquecer" id="esquecer" type="button">Esquecer a senha neste celular</button>
</div>

const CHAVE_SENHA='curral_nielt_senha';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decifra(senha){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(CIFRA.s),iterations:CIFRA.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const txt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CIFRA.i)},k,b64(CIFRA.d));
  return JSON.parse(new TextDecoder().decode(txt));
}
let P=null;

const $=function(s){return document.querySelector(s)};
const esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
const brc=function(s){return s?s.slice(8,10)+'/'+s.slice(5,7):'—'};
const brd=function(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):'—'};
const hoje=function(){return P.dia};
const dif=function(a,b){return Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000)};
const plu=function(n,s,p){return n+' '+(n===1?s:p)};

// contador de dias contra o dia real do aparelho, não contra o P.dia congelado da rodada
const hojeISO=function(){const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const diasVivo=function(a){return a.ult?dif(hojeISO(),a.ult):null};

const COR={'EM DIA':'ok','A VENCER':'warn','ATRASADA':'dan','ATRASADA CRÍTICA':'dan',
  'AGUARDANDO 90 DEL':'azul','PRIMIPARA NA JANELA':'warn','SEM REGISTRO':'neu',
  'FORA DA LACTAÇÃO':'neu','FORA DO REBANHO':'neu'};
const ROT={'PRIMIPARA NA JANELA':'1ª VEZ','AGUARDANDO 90 DEL':'AGUARDA 90 DEL',
  'FORA DA LACTAÇÃO':'NÃO LACTANTE','FORA DO REBANHO':'SAIU DO REBANHO'};
const rotulo=function(a){return ROT[a.st]||a.st};
const tgSit=function(a){return '<span class="tg t-'+(COR[a.st]||'neu')+'">'+esc(rotulo(a))+'</span>'};

const temTaco=function(a){return a.tac.some(function(t){return t.st!=='RETIRADO'})};
const tacoAberto=function(a){return a.tac.filter(function(t){return t.st!=='RETIRADO'})};

let busca='',filtro='',lote='',limite=30;

function acha(){
  const q=busca.trim().toLowerCase();
  let r=P.an.filter(function(a){
    if(q && !(a.b.toLowerCase().indexOf(q)===0 || (a.nm||'').toLowerCase().indexOf(q)>=0 || a.b.toLowerCase().indexOf(q)>=0)) return false;
    if(lote && a.lo!==lote) return false;
    if(filtro==='fila' && !a.fila) return false;
    if(filtro==='atr' && a.st!=='ATRASADA' && a.st!=='ATRASADA CRÍTICA') return false;
    if(filtro==='les' && !a.les) return false;
    if(filtro==='tac' && !temTaco(a)) return false;
    if(filtro==='vencer' && a.st!=='A VENCER') return false;
    return true;
  });
  if(q) r.sort(function(x,y){
    const ex=x.b.toLowerCase()===q?0:x.b.toLowerCase().indexOf(q)===0?1:2;
    const ey=y.b.toLowerCase()===q?0:y.b.toLowerCase().indexOf(q)===0?1:2;
    return ex-ey || x.b.length-y.b.length || (+x.b)-(+y.b);
  });
  else if(filtro==='fila') r.sort(function(x,y){return x.fila.ord-y.fila.ord});
  else r.sort(function(x,y){return (y.di==null?-1:y.di)-(x.di==null?-1:x.di)});
  return r;
}

function linhaItem(a){
  const tgs=[tgSit(a)];
  if(a.fila) tgs.push('<span class="tg t-pri">FILA '+esc(a.fila.k)+'</span>');
  else{ if(a.les) tgs.push('<span class="tg t-dan">LESÃO</span>');
        if(temTaco(a)) tgs.push('<span class="tg t-warn">TACO</span>'); }
  const sub=[a.lo||'sem lote']; if(a.mc) sub.push(a.mc);
  sub.push(a.npass?plu(a.npass,'passagem','passagens'):'nunca passou no brete');
  if(a.ult) sub.push('última '+brd(a.ult));
  return '<li><button class="it" type="button" data-b="'+esc(a.b)+'">'+
    '<span class="br">'+esc(a.b)+'</span>'+
    '<span class="meio"><span class="l1">'+tgs.join('')+'</span>'+
      '<span class="l2">'+esc(sub.join(' · '))+'</span></span>'+
    (a.di==null?'':'<span class="dias">'+diasVivo(a)+'<small>'+
      (a.st==='FORA DO REBANHO'||a.st==='FORA DA LACTAÇÃO'?'D ATRÁS':'DIAS')+'</small></span>')+
    '</button></li>';
}

function pinta(){
  const r=acha(), qv=busca.trim()!=='';
  const semNada=!qv && !filtro && !lote;
  $('#painel').hidden=!semNada;
  $('#limpar').hidden=!qv;
  $('#conta').hidden=semNada;
  if(!semNada) $('#conta').textContent=r.length?plu(r.length,'animal','animais'):'';
  $('#lista').innerHTML=semNada?'':r.slice(0,limite).map(linhaItem).join('');
  const m=$('#mais'); m.hidden=semNada||r.length<=limite;
  if(!m.hidden) m.textContent='Ver mais '+Math.min(30,r.length-limite)+' de '+r.length;
  $('#vazio').hidden=semNada||r.length>0;
  if(!semNada&&!r.length) $('#vazio').innerHTML=qv
    ?'Nenhum animal com <b>'+esc(busca.trim())+'</b>.<br>O brinco existe no Cowmed?'
    :'Nenhum animal nesse filtro.';
}

/* ---------- ficha ---------- */
function blocoSit(a){
  const c=[];
  const cel=function(k,v){c.push('<div class="kv"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>')};
  const saiu=a.st==='FORA DO REBANHO'||a.st==='FORA DA LACTAÇÃO';
  // quem conta pelo DEL tem a data do PARTO como marco, não a de um casqueamento
  const peloDel=!!(a.org&&a.org.indexOf('DEL')>=0);
  const dv=diasVivo(a);
  if(a.di!=null) cel(saiu?'Desde a última passagem':peloDel?'Dias desde o parto':'Dias sem casquear',
    '<b>'+dv+'</b> <small>d</small>');
  if(a.ult) cel(saiu?'Última passagem':peloDel?'Último parto':'Último casqueamento',brd(a.ult));
  if(a.del!=null) cel('DEL',(peloDel?dv:a.del)+' <small>d</small>');
  cel('Passagens no brete',String(a.npass));
  if(a.prev) cel('Previsão de secagem','<span style="font-size:15px">'+brd(a.prev)+'</span>');
  if(a.id) cel('Idade','<span style="font-size:15px">'+esc(a.id)+'</span>');
  let n='';
  if(a.di!=null) n='<div class="nota">Contador de dias ao vivo, até hoje ('+brd(hojeISO())+'). O resto desta ficha — situação, fila, taco — é da rodada de '+brd(P.dia)+'.</div>';
  if(a.org) n+='<div class="nota">Origem da data: '+esc(a.org)+'.</div>';
  if(a.nunca) n+='<div class="nota">Primípara que ainda não passou pelo brete — o relógio conta do parto e o 1º casqueamento é aos 90 DEL.</div>';
  else if(a.pri) n+='<div class="nota">Primípara já casqueada — daqui em diante conta como qualquer outra vaca (a vencer aos 75 d, atrasada aos 90 d).</div>';
  return '<div class="bloco"><h3>Situação em '+brd(P.dia)+'</h3><div class="gr">'+c.join('')+'</div>'+n+'</div>';
}

function avisos(a){
  const v=[];
  if(a.st==='FORA DO REBANHO') v.push('<div class="av a-neu"><b>Fora do rebanho</b>'+
    'Este brinco não aparece no export do Cowmed de '+brd(P.dia)+'. O histórico abaixo é o que ficou registrado.</div>');
  else if(a.st==='FORA DA LACTAÇÃO') v.push('<div class="av a-neu"><b>Não está em lactação</b>'+
    'Está no Cowmed'+(a.stx?' como <b style="display:inline">'+esc(a.stx)+'</b>':'')+', fora do universo de 464 lactantes — não entra no cálculo da fila.</div>');
  if(a.fila) v.push('<div class="av a-azul"><b>Na fila de '+brd(P.sess)+' — nº '+a.fila.ord+'</b>'+
    esc(a.fila.pq)+'</div>');
  if(a.les){
    const d=dif(a.les.rev,P.dia);
    v.push('<div class="av a-dan"><b>Achado em aberto desde '+brd(a.les.d)+'</b>'+
      esc(a.les.a.join(' · '))+' — <span class="obs">'+esc(a.les.o||'sem anotação')+'</span><br>'+
      (d<0?'revisão VENCIDA há '+(-d)+' d':d===0?'revisão vence hoje':'rever até '+brd(a.les.rev)+' (em '+d+' d)')+
      (a.les.mk?' — prazo escrito na folha':'')+'</div>');
  }
  tacoAberto(a).forEach(function(t){
    const d=t.pz?dif(t.pz,P.dia):null;
    v.push('<div class="av a-warn"><b>Taco '+(t.st==='VENCIDO'?'VENCIDO':'em prazo')+'</b>'+
      'Aplicado em '+brd(t.d)+(t.o?' — <span class="obs">'+esc(t.o)+'</span>':'')+'<br>'+
      (d==null?'':d<0?'retirar já: passou do prazo ('+brd(t.pz)+') há '+(-d)+' d':'retirar até '+brd(t.pz)+' (em '+d+' d)')+'</div>');
  });
  return v.join('');
}

const NOMEACH={MORT:'mortelaria',FAIXA:'faixa',BROCA:'broca',LAMINITE:'laminite',TILOMA:'tiloma',
  'PINÇA':'pinça',SOLA:'sola dupla',INFEC:'infecção',SUSP:'suspeita','GARRÃO':'garrão'};
const TACOTXT={APL:'taco aplicado',PRO:'taco prorrogado',RET:'taco retirado'};

function tempo(a){
  const ev=a.ev.slice().reverse();
  const li=ev.map(function(e){
    if(e.t==='parto') return '<li class="par"><div class="qd"><span class="dt">'+brd(e.d)+'</span>'+
      '<span class="tg t-neu">PARTO</span></div></li>';
    if(e.t==='secagem') return '<li class="sec"><div class="qd"><span class="dt">'+brd(e.d)+'</span>'+
      '<span class="tg t-azul">SECAGEM</span>'+(e.int!=null?'<span class="int">'+e.int+' d depois</span>':'')+'</div>'+
      '<div class="fo">Casqueada na secagem'+(e.del?' · '+e.del+' DEL':'')+(e.tr?' · '+esc(e.tr):'')+'</div></li>';
    const tags=(e.a||[]).map(function(k){return '<span class="tg t-dan">'+esc(NOMEACH[k]||k)+'</span>'});
    if(e.tc) tags.push('<span class="tg t-warn">'+TACOTXT[e.tc]+(e.tc==='APL'&&e.pz&&e.pz!==30?' '+e.pz+' d':'')+'</span>');
    if(!tags.length) tags.push('<span class="tg t-ok">rotina</span>');
    return '<li'+((e.a&&e.a.length)?' class="ach"':'')+'>'+
      '<div class="qd"><span class="dt">'+brd(e.d)+'</span>'+
      (e.int!=null?'<span class="int">'+e.int+' d depois</span>':'')+'</div>'+
      (e.o?'<div class="txt">'+esc(e.o)+'</div>':'')+
      '<div class="tr">'+tags.join('')+'</div>'+
      (e.fo?'<div class="fo">folha '+esc(e.fo)+'</div>':'')+'</li>';
  }).join('');
  const pass=a.ev.filter(function(e){return e.t!=='parto'});
  const comAch=a.ev.filter(function(e){return e.a&&e.a.length}).length;
  const ints=pass.map(function(e){return e.int}).filter(function(x){return x!=null});
  const med=ints.length?Math.round(ints.reduce(function(s,x){return s+x},0)/ints.length):null;
  const res=[plu(pass.length,'passagem','passagens'),plu(comAch,'com achado','com achado')];
  if(med!=null) res.push('intervalo médio '+med+' d');
  return '<div class="bloco"><h3>Linha do tempo</h3>'+
    (li?'<ul class="tl">'+li+'</ul>':'<div style="color:var(--mut);font-size:13.5px">Nenhuma passagem registrada.</div>')+
    (pass.length?'<div class="nota">'+esc(res.join(' · '))+'</div>':'')+'</div>';
}

function tacosFechados(a){
  const t=a.tac.filter(function(x){return x.st==='RETIRADO'});
  if(!t.length) return '';
  return '<div class="bloco"><h3>Tacos já encerrados</h3>'+t.map(function(x){
    return '<div style="font-size:13px;line-height:1.55;padding:5px 0;border-bottom:1px solid var(--line)">'+
      (x.d?'<b>'+brd(x.d)+'</b> → ':'<b>sem aplicação registrada</b> → ')+
      (x.ret?brd(x.ret):'—')+'<br><span style="color:var(--mut)">'+esc(x.como||'')+'</span></div>';
  }).join('')+'</div>';
}

function abreFicha(b,push){
  const a=P.an.filter(function(x){return x.b===b})[0];
  if(!a) return;
  const sub=[]; if(a.lo) sub.push(esc(a.lo)); if(a.mc) sub.push('<b>'+esc(a.mc)+'</b>');
  $('#ficha').innerHTML=
    '<div style="padding:calc(10px + env(safe-area-inset-top)) 16px 0">'+
      '<button class="voltar" id="volta" type="button">‹ voltar</button></div>'+
    '<div class="fbr"><h2>'+esc(a.b)+'</h2>'+(a.nm?'<span class="nm">'+esc(a.nm)+'</span>':'')+'</div>'+
    '<div class="fsub">'+tgSit(a)+(sub.length?'<span>'+sub.join(' · ')+'</span>':'')+'</div>'+
    avisos(a)+blocoSit(a)+tempo(a)+tacosFechados(a)+
    '<footer>Dados de <b>'+brd(P.dia)+'</b> · rodada '+esc(P.ver)+
    '. A pergunta que esta ficha responde é <b>quando este animal passou pelo brete e o que foi visto</b> — '+
    'a decisão da sessão continua sendo a lista impressa.</footer>';
  $('#volta').addEventListener('click',function(){history.back()});
  $('#tela').hidden=true; $('#ficha').hidden=false; window.scrollTo(0,0);
  if(push!==false) history.pushState({b:b},'','#'+b);
}
function fechaFicha(){ $('#ficha').hidden=true; $('#tela').hidden=false; }

/* ---------- monta ---------- */
function iniciaApp(){
  $('#dia').textContent='dados de '+brd(P.dia);
  const nFila=P.an.filter(function(a){return a.fila}).length;
  const nAtr=P.an.filter(function(a){return a.st==='ATRASADA'||a.st==='ATRASADA CRÍTICA'}).length;
  const nVen=P.an.filter(function(a){return a.st==='A VENCER'}).length;
  const nLes=P.an.filter(function(a){return a.les}).length;
  const nTac=P.an.filter(temTaco).length;
  $('#painel').innerHTML=
    '<button class="pcard b" type="button" data-f="fila"><b>'+nFila+'</b><span>na fila de '+brd(P.sess)+'</span></button>'+
    '<button class="pcard g" type="button" data-f="atr"><b>'+nAtr+'</b><span>atrasadas (mais de 90 d)</span></button>'+
    '<button class="pcard g" type="button" data-f="les"><b>'+nLes+'</b><span>com achado em aberto</span></button>'+
    '<button class="pcard y" type="button" data-f="tac"><b>'+nTac+'</b><span>com taco em aberto</span></button>'+
    '<button class="pcard y" type="button" data-f="vencer"><b>'+nVen+'</b><span>a vencer (75 a 90 d)</span></button>'+
    '<button class="pcard" type="button" data-f=""><b>'+P.nlact+'</b><span>vacas em lactação</span></button>';
  $('#fLote').innerHTML='<option value="">Todos os lotes</option>'+
    P.lotes.map(function(l){return '<option>'+esc(l)+'</option>'}).join('');
  $('#rodape').innerHTML='Digite o brinco na caixa de cima — a lista filtra enquanto você digita. '+
    'Toque no animal para ver a ficha: situação, achado em aberto, taco e <b>tudo o que já foi anotado nele</b>, '+
    'passagem por passagem. <b>Secagem conta como passagem</b> (a vaca é casqueada ao secar) e o <b>parto</b> '+
    'aparece na linha do tempo porque é dele que o relógio recomeça. '+
    'Dados de <b>'+brd(P.dia)+'</b>, rodada '+esc(P.ver)+' · '+P.nlact+' vacas em lactação, '+
    P.an.length+' animais no total. Para renovar, feche a rodada de cascos e publique de novo.';

  $('#q').addEventListener('input',function(e){busca=e.target.value;limite=30;pinta()});
  $('#limpar').addEventListener('click',function(){busca='';$('#q').value='';limite=30;$('#q').focus();pinta()});
  $('#chips').addEventListener('click',function(e){
    const b=e.target.closest('button.chip'); if(!b) return;
    filtro=(filtro===b.dataset.f)?'':b.dataset.f; limite=30;
    Array.prototype.forEach.call(document.querySelectorAll('button.chip'),function(x){
      x.setAttribute('aria-pressed',String(x.dataset.f===filtro))});
    pinta();
  });
  $('#fLote').addEventListener('change',function(e){lote=e.target.value;limite=30;pinta()});
  $('#painel').addEventListener('click',function(e){
    const b=e.target.closest('button.pcard'); if(!b) return;
    filtro=b.dataset.f; limite=30;
    Array.prototype.forEach.call(document.querySelectorAll('button.chip'),function(x){
      x.setAttribute('aria-pressed',String(x.dataset.f===filtro))});
    pinta(); window.scrollTo(0,0);
  });
  $('#lista').addEventListener('click',function(e){
    const b=e.target.closest('button.it'); if(b) abreFicha(b.dataset.b);
  });
  $('#mais').addEventListener('click',function(){limite+=30;pinta()});
  window.addEventListener('popstate',function(ev){
    if(ev.state&&ev.state.b) abreFicha(ev.state.b,false); else fechaFicha();
  });
  pinta();
  const h=location.hash.replace('#','');
  if(h&&P.an.some(function(a){return a.b===h})) abreFicha(h);
}

async function entrar(senha,lembrar){
  try{ P=await decifra(senha); }catch(e){ return false; }
  try{ if(lembrar) localStorage.setItem(CHAVE_SENHA,senha); else localStorage.removeItem(CHAVE_SENHA); }catch(e){}
  document.getElementById('trava').hidden=true;
  document.getElementById('app').hidden=false;
  iniciaApp();
  return true;
}
document.getElementById('fTrava').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('entrar'), er=document.getElementById('erro');
  b.disabled=true; b.textContent='Abrindo…'; er.textContent='';
  const ok=await entrar(document.getElementById('senha').value,document.getElementById('lembrar').checked);
  if(!ok){ b.disabled=false; b.textContent='Entrar'; er.textContent='Senha errada. Confira com o Emilio.'; document.getElementById('senha').select(); }
});
document.getElementById('esquecer').addEventListener('click',()=>{ try{localStorage.removeItem(CHAVE_SENHA);}catch(e){} location.reload(); });
(async()=>{
  let s=null; try{ s=localStorage.getItem(CHAVE_SENHA); }catch(e){}
  if(s&&await entrar(s,true)) return;
  document.getElementById('trava').hidden=false; document.getElementById('senha').focus();
})();
if(!window.crypto||!crypto.subtle){ document.getElementById('erro').textContent='Abra pelo endereço https:// no navegador.'; }
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
